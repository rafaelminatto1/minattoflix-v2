name: Preparar vídeo para iOS
run-name: Preparar ${{ inputs.file_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      file_id:
        required: true
        type: string
      api_origin:
        required: true
        type: string
        default: https://minattoflix-v2.rafalegollas.workers.dev
permissions:
  contents: read
  id-token: write
concurrency:
  group: prepare-media-${{ inputs.file_id }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Instalar FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Preparar, validar e enviar vídeo
        env:
          PREPARATION_JOB_ID: ${{ inputs.job_id }}
          PREPARATION_API_ORIGIN: ${{ inputs.api_origin }}
        run: python3 scripts/prepare_media.py
