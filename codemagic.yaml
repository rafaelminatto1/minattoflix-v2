workflows:
  ios-testflight:
    name: MinattoFlix iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: MinattoFlix Codemagic
    environment:
      node: 24
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rafaelminatto.minattoflix
      vars:
        APP_STORE_APPLE_ID: "6824745749"
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Check TypeScript
        script: npm run typecheck
      - name: Run regression tests
        script: npm test
      - name: Prepare Capacitor iOS assets and Swift packages
        script: npm run ios:prepare
      - name: Apply distribution signing profiles
        script: xcode-project use-profiles
      - name: Set unique build number
        script: |
          set -euo pipefail
          cd ios/App
          agvtool new-version -all "${BUILD_NUMBER:?Missing Codemagic build number}"
      - name: Archive and export signed IPA
        script: |
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        # Apple's API rejects assigning builds to this internal group.
        # Enable automatic distribution or add the build in App Store Connect.
        submit_to_app_store: false

